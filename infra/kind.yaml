kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloudops-ai-lab
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
      - containerPort: 30900
        hostPort: 9090
        listenAddress: "127.0.0.1"
      - containerPort: 30588
        hostPort: 4588
        listenAddress: "127.0.0.1"
      - containerPort: 30418
        hostPort: 4318
        listenAddress: "127.0.0.1"
      - containerPort: 30310
        hostPort: 3100
        listenAddress: "127.0.0.1"
      - containerPort: 30320
        hostPort: 3200
        listenAddress: "127.0.0.1"
